<!doctype html>
<!-- Página del motor de dados 3D: se carga dentro de un iframe del mismo origen y solo habla por mensajes (ver src/lib/dsn/pagina/motorDados.js; con ?modo=vista es la vista de un dado que se gira). -->
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dados</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
      #dice-arena { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
      #dice-arena > canvas { display: block; max-width: none; }
      /* Modo vista (/dados?modo=vista): un dado que se gira con el puntero, sin arena. */
      #vista { display: none; }
      .modo-vista #dice-arena { display: none; }
      .modo-vista #vista { display: block; position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; }
      #vista > canvas { display: block; max-width: none; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="dice-arena" aria-hidden="true"></div>
    <div id="vista"></div>
    <script type="module" src="/src/lib/dsn/pagina/motorDados.js"></script>
  </body>
</html>
